<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22a55c"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Fundo verde arredondado -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Ponto central (origem do fluxo) -->
  <circle cx="10" cy="32" r="4.5" fill="white"/>

  <!-- Quadra 1 — menor, mais transparente -->
  <path d="M10,19 L26,19 L26,45 L10,45"
        fill="none" stroke="white" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.38"/>

  <!-- Quadra 2 — média -->
  <path d="M10,11 L40,11 L40,53 L10,53"
        fill="none" stroke="white" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.65"/>

  <!-- Quadra 3 — maior, totalmente opaca -->
  <path d="M10,4 L57,4 L57,60 L10,60"
        fill="none" stroke="white" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
