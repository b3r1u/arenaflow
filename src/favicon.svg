<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo escuro arredondado -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Ponto central (origem do fluxo) -->
  <circle cx="10" cy="32" r="4.5" fill="#22c55e"/>

  <!-- Quadra 1 — menor, mais transparente -->
  <path d="M10,19 L26,19 L26,45 L10,45"
        fill="none" stroke="#22c55e" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.38"/>

  <!-- Quadra 2 — média -->
  <path d="M10,11 L40,11 L40,53 L10,53"
        fill="none" stroke="#22c55e" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.65"/>

  <!-- Quadra 3 — maior, totalmente opaca -->
  <path d="M10,4 L57,4 L57,60 L10,60"
        fill="none" stroke="#22c55e" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
