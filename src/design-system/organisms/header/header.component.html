<header class="ds-header">
  <button class="ds-header__menu-btn" (click)="menuClick.emit()" aria-label="Menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <div class="ds-header__brand">
    <div class="ds-header__brand-icon">
      <img *ngIf="logoUrl" [src]="logoUrl" alt="Logo" class="ds-header__brand-img" />
      <span *ngIf="!logoUrl">{{ establishmentInitials }}</span>
    </div>
    <span class="ds-header__brand-name">{{ establishmentName }}</span>
  </div>
</header>
